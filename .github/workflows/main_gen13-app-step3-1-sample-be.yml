# API（backend/）を Azure App Service の Web アプリにデプロイする
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Azure 側で必要な設定（ワークフローの外）:
#   スタートアップ コマンド: gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind=0.0.0.0 --timeout 120 main:app
#   環境変数: SCM_DO_BUILD_DURING_DEPLOYMENT=true（Azure 側で pip install する）、USE_MYSQL・DB_*・CORS_ORIGINS

name: Build and deploy Python app to Azure Web App - gen13-app-step3-1-sample-be

on:
  push:
    branches:
      - 'main'
    paths:   # backend/ を変えたときだけデプロイする（画面だけの変更では動かない）
      - 'backend/**'
      - '.github/workflows/main_gen13-app-step3-1-sample-be.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # App Service のランタイム（PYTHON|3.14）とそろえる

      # 依存関係が入るかを先に確かめる（本番の pip install は Azure 側の Oryx が行う）
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # backend/ の中身だけを zip にして送る（リポジトリの一番上や frontend/ は送らない）
      - name: Zip artifact for deployment
        working-directory: backend
        run: zip -qr ../release.zip . -x 'tests/*' '*__pycache__*'

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'gen13-app-step3-1-sample-be'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_60E205199364439AB9E911A22C7649D9 }}
