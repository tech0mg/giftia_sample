# 画面（frontend/）を Azure App Service の Web アプリにデプロイする
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
#
# ビルドはこの GitHub Actions の上で行う。Azure 側ではビルドしない
#   （Web アプリの環境変数に SCM_DO_BUILD_DURING_DEPLOYMENT=true を入れない。入れると NEXT_PUBLIC_API_URL のないビルドで上書きされる）
# NEXT_PUBLIC_API_URL は、リポジトリの Settings → Secrets and variables → Actions → Variables に入れる
#   値は API の Web アプリの URL（末尾に / や /api を付けない）。ビルドのときに画面のコードへ埋め込まれる

name: Build and deploy Node.js app to Azure Web App - gen13-app-step3-1-sample-fe

on:
  push:
    branches:
      - 'main'
    paths:   # frontend/ を変えたときだけデプロイする（API だけの変更では動かない）
      - 'frontend/**'
      - '.github/workflows/main_gen13-app-step3-1-sample-fe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'   # App Service のランタイム（NODE|24-lts）とそろえる

      - name: Check NEXT_PUBLIC_API_URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::リポジトリの Variables に NEXT_PUBLIC_API_URL がありません（API の URL を入れる）"
            exit 1
          fi

      - name: npm ci and build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      # 送るファイルが多いので、zip 1つにまとめて送る（.next/cache はビルドの再利用用で、動かすのには要らない）
      - name: Zip artifact for deployment
        run: zip -qr ../release.zip . -x '.next/cache/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gen13-app-step3-1-sample-fe'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_74561582F96A4E93BAC6D66A1219098A }}
